version: 2
updated: 2026-08-06
source_repositories:
  product: Vala-Claims/vala
  docs: Vala-Claims/docs

rules:
  ui_change_requires: [text_review, screenshot_review]
  workflow_change_requires: [text_update, dependency_review, walkthrough_review]
  signer_or_submission_change_requires: [forms_vsign_review, quickstart_review]
  navigation_or_visibility_change_requires: [affected_page_review, quickstart_review]
  plan_or_permission_change_requires: [text_update, availability_callout_review, admin_review]
  backend_only_change:
    default: no_customer_docs
    exceptions: [behavior_changed, limits_changed, permissions_changed, generated_output_changed]

pages:
  welcome:
    path: index.mdx
    features: [dashboard, contacts, clients, ask_vala, reports, forms, vsign]
    review: [text, screenshot]

  dashboard:
    path: dashboard/overview.mdx
    features: [dashboard, app_dashboard, widgets]
    upstream_paths:
      - src/pages/dashboard.astro
      - src/components/DashboardPage.svelte
      - src/components/Dashboard/**
      - src/lib/appDashboard/**
      - backend/internal/handlers/app_dashboard.go
      - backend/internal/service/app_dashboard.go
    review: [text, screenshot]

  contacts:
    path: contacts/overview.mdx
    features: [contacts, contact_views, clients]
    upstream_paths:
      - src/pages/contacts.astro
      - src/components/ContactsWorkspace/**
      - src/components/Contacts/**
      - src/components/ContactsPage/**
      - src/components/ClientsPage/**
      - src/lib/navigation/workspaceNav.ts
    review: [text, screenshot]

  quickstart:
    path: getting-started/quickstart.mdx
    features: [contacts, clients, documents, ask_vala, reports, forms, vsign]
    upstream_paths:
      - src/components/ClientForm.svelte
      - src/components/ClientDetailsPage/**
      - src/components/VSign/**
      - src/components/Forms/**
    depends_on_pages: [clients, documents, ask_vala, reports, forms_vsign]
    review: [text, screenshot, walkthrough]

  clients:
    path: veteran-records/create-a-veteran.mdx
    features: [clients, contacts, veterans, relationships, primary_point_of_contact]
    upstream_paths:
      - src/components/ClientForm.svelte
      - src/components/ClientDetailsPage/**
      - backend/internal/handlers/client.go
      - backend/internal/service/client.go
    downstream_pages: [quickstart, forms_vsign]
    review: [text, screenshot]

  client_dashboard:
    path: veteran-records/client-dashboard.mdx
    features: [clients, client_dashboard, widgets, claim_blockers, deadlines, signatures, tasks, messages]
    upstream_paths:
      - src/components/ClientDetailsPage/Tabs/Dashboard/**
      - src/lib/clientDashboard/**
      - backend/internal/handlers/client_dashboard.go
      - backend/internal/service/client_dashboard.go
      - backend/internal/service/client_dashboard_summary.go
    review: [text, screenshot]

  client_details:
    path: veteran-records/client-details.mdx
    features: [clients, client_details, primary_point_of_contact, client_fields, client_notes]
    upstream_paths:
      - src/components/ClientDetailsPage/Tabs/Details/**
      - src/components/ClientForm.svelte
      - src/components/Contacts/PrimaryPocSelector.svelte
      - backend/internal/handlers/client.go
      - backend/internal/service/client.go
    review: [text, screenshot]

  relationships:
    path: veteran-records/relationships.mdx
    features: [contacts, relationships, primary_point_of_contact, client_portal]
    upstream_paths:
      - src/components/ClientDetailsPage/Tabs/Relationships/**
      - src/components/Contacts/PrimaryPocSelector.svelte
      - backend/internal/handlers/contact.go
      - backend/internal/handlers/contact_portal.go
      - backend/internal/service/contact.go
    review: [text, screenshot]

  client_activity:
    path: veteran-records/activity.mdx
    features: [clients, activity, inbox, tasks, messages, documents, claims, calendar]
    upstream_paths:
      - src/components/ClientDetailsPage/Tabs/Activity/**
      - src/lib/inboxActivityRoutes.ts
      - backend/internal/handlers/client_activity.go
      - backend/internal/handlers/inbox.go
      - backend/internal/service/client_activity.go
      - backend/internal/service/org_activity.go
    review: [text, screenshot]

  claims:
    path: core-workflows/claims.mdx
    features: [claims, claim_records, claim_views]
    upstream_paths:
      - src/pages/claims.astro
      - src/components/ClaimsManagement/**
      - src/components/ClientDetailsPage/Tabs/Claims/**
      - src/lib/navigation/workspaceNav.ts
      - backend/internal/handlers/claim.go
      - backend/internal/service/claim.go
    downstream_pages: [quickstart]
    review: [text, screenshot, walkthrough]

  claim_details:
    path: claims/details.mdx
    features: [claims, claim_records, conditions, evidence, forms, tasks, comments]
    upstream_paths:
      - src/components/ClaimsPage/ClaimsDetails/ClaimInfoCard.svelte
      - src/components/ClaimsPage/ClaimsDetails/DocumentSelectionDialog.svelte
      - src/components/ClaimsPage/ClaimsDetails/AddFormToClaimDialog.svelte
      - src/components/ClaimsPage/ClaimsDetails/TasksSection/**
      - src/lib/claimWorkspace.ts
      - backend/internal/handlers/claim.go
      - backend/internal/service/claim.go
    review: [text, screenshot, walkthrough]

  claim_dates:
    path: claims/dates.mdx
    features: [claims, claim_dates, document_findings]
    upstream_paths:
      - src/components/ClaimsPage/ClaimsDetails/ClaimDatesSection.svelte
      - src/lib/claim-date-sources.ts
      - backend/internal/handlers/claim.go
      - backend/internal/service/claim.go
    review: [text, screenshot]

  claim_history:
    path: claims/history.mdx
    features: [claims, claim_history, claim_audit]
    upstream_paths:
      - src/components/ClaimsPage/ClaimsDetails/ClaimHistorySection.svelte
      - backend/internal/handlers/claim.go
      - backend/internal/service/claim_history.go
    review: [text, screenshot]

  claim_financials:
    path: claims/financials.mdx
    features: [claims, claim_financials, document_findings, permissions]
    upstream_paths:
      - src/components/ClaimsPage/ClaimsDetails/ClaimFinancialsSection.svelte
      - src/lib/claim-financial-findings.ts
      - src/types/claim-financial.ts
      - backend/internal/handlers/claim_financial.go
      - backend/internal/service/claim_financial.go
    review: [text, screenshot]

  conditions:
    path: core-workflows/conditions.mdx
    features: [conditions, ratings, rating_decisions, condition_extraction]
    upstream_paths:
      - src/components/**/*Condition*
      - src/components/**/*Rating*
      - backend/internal/**/*condition*
      - backend/internal/**/*rating*
      - agents/**/*condition*
    depends_on_pages: [clients, documents]
    downstream_pages: [reports, quickstart]
    review: [text, screenshot, walkthrough]

  documents:
    path: core-workflows/documents.mdx
    features: [documents, evidence, citations, document_analysis, evidence_linking]
    upstream_paths:
      - src/components/**/*Document*
      - src/components/**/*Evidence*
      - src/components/**/*Citation*
      - backend/internal/**/*document*
      - backend/internal/**/*evidence*
      - agents/**/*document*
      - agents/**/*evidence*
    downstream_pages: [ask_vala, reports, quickstart]
    review: [text, screenshot, walkthrough]

  ask_vala:
    path: ai/chat-with-vala.mdx
    features: [ask_vala, ai_chat, citations, document_questions]
    upstream_paths:
      - src/components/**/*Chat*
      - src/pages/**/*chat*
      - backend/internal/**/*chat*
      - agents/**/*chat*
    downstream_pages: [quickstart, reports]
    review: [text, screenshot, walkthrough]

  reports:
    path: core-workflows/reports.mdx
    features: [reports, chronology, theory_report, evidence, conditions]
    upstream_paths:
      - src/pages/tools/report-templates.astro
      - src/components/ReportTemplates/**
      - src/components/Chat/ChatArtifactsModal.svelte
      - src/components/Chat/ChatInterface.svelte
      - backend/internal/handlers/report_template.go
      - backend/internal/service/graphrag_chat_report_evidence.go
      - backend/internal/service/report_citation_verify.go
    depends_on_pages: [clients, ask_vala, conditions, documents]
    downstream_pages: [quickstart]
    review: [text, screenshot, walkthrough]

  notes:
    path: core-workflows/notes.mdx
    features: [notes, note_records]
    upstream_paths:
      - src/pages/notes.astro
      - src/pages/tools/notes.astro
      - src/components/NotesPage/**
      - backend/internal/handlers/note.go
    review: [text, screenshot]

  calendar:
    path: calendar/overview.mdx
    features: [calendar, events, scheduling]
    upstream_paths:
      - src/pages/calendar.astro
      - src/components/CalendarPage/**
      - src/components/ClientDetailsPage/Tabs/Calendar/**
      - backend/internal/handlers/calendar.go
      - backend/internal/service/calendar.go
    review: [text, screenshot]

  templates:
    path: templates/overview.mdx
    features: [templates, library, questionnaires, reports, message_templates]
    upstream_paths:
      - src/pages/templates.astro
      - src/lib/navigation/workspaceNav.ts
    review: [text, screenshot]

  template_documents:
    path: core-workflows/library.mdx
    features: [templates, documents, library, organization_documents]
    upstream_paths:
      - src/pages/tools/library.astro
      - src/components/LibraryPage/**
      - src/lib/libraryAdvancedSearch.ts
      - backend/internal/handlers/organization_library_folder.go
      - backend/internal/service/organization_library_folder.go
    review: [text, screenshot]

  questionnaires:
    path: core-workflows/web-forms.mdx
    features: [questionnaires, custom_forms, web_forms]
    upstream_paths:
      - src/pages/custom-forms.astro
      - src/components/CustomForms/**
      - backend/internal/handlers/custom_form.go
    review: [text, screenshot, walkthrough]

  template_messages:
    path: core-workflows/message-templates.mdx
    features: [messages, message_templates]
    upstream_paths:
      - src/pages/messages.astro
      - src/components/MessagesPage/**
      - backend/internal/handlers/message_template.go
      - backend/internal/service/message_template.go
    review: [text, screenshot]

  messages:
    path: core-workflows/messages.mdx
    features: [messages, client_messages, message_templates, client_portal]
    upstream_paths:
      - src/components/ClientDetailsPage/Tabs/Messages/**
      - backend/internal/handlers/message.go
      - backend/internal/service/message.go
    review: [text, screenshot]

  forms_vsign:
    path: core-workflows/forms-and-vsign.mdx
    features: [forms, pdf_autofill, wysiwyg, vsign, signing_packets, client_portal]
    upstream_paths:
      - src/components/Forms/**
      - src/components/VSign/**
      - src/components/ClientPortal/VSignEnvelopePage.svelte
      - src/components/ClientPortal/SignaturesTab.svelte
      - src/components/ClientDetailsPage/Tabs/IntakeCallForms/**
      - src/lib/pdfClientForms.ts
      - src/types/esign.ts
      - backend/internal/handlers/esign.go
      - backend/internal/handlers/pdf.go
      - backend/internal/service/esign.go
      - backend/internal/service/pdf.go
      - backend/internal/service/vsign.go
      - agents/pdf_fill/**
    depends_on_pages: [clients]
    downstream_pages: [quickstart]
    review: [text, screenshot, walkthrough]

  tasks:
    path: core-workflows/tasks.mdx
    features: [tasks, assignments, due_dates, task_status]
    upstream_paths:
      - src/components/**/*Task*
      - src/components/ClientDetailsPage/Tabs/Tasks/**
      - backend/internal/**/*task*
    downstream_pages: [workflows, quickstart]
    review: [text, screenshot]

  workflows:
    path: core-workflows/automations.mdx
    features: [workflows, automations, triggers, actions, notifications, task_automation]
    upstream_paths:
      - src/components/**/*Automation*
      - backend/internal/**/*automation*
      - src/lib/navigation/workspaceNav.ts
    depends_on_pages: [tasks, forms_vsign]
    downstream_pages: [quickstart]
    review: [text, screenshot, walkthrough]

  calls:
    path: ai/calls-and-transcripts.mdx
    features: [calls, transcription, guided_scripts, call_records]
    upstream_paths:
      - src/components/**/*Call*
      - src/components/**/*Transcript*
      - backend/internal/**/*call*
      - backend/internal/**/*transcri*
      - agents/transcription/**
    downstream_pages: [ask_vala, clients, quickstart]
    review: [text, screenshot, walkthrough]

  backpay_calculator:
    path: backpay-calculator.mdx
    features: [backpay_calculator, calculators]
    upstream_paths:
      - src/pages/tools/backpay-calculator.astro
      - src/components/BackpayCalculator/**
    review: [text, screenshot]

  pension_calculator:
    path: untitled-page.mdx
    features: [pension_calculator, calculators]
    upstream_paths:
      - src/pages/tools/pension-calculator.astro
      - src/components/PensionCalculator/**
    review: [text, screenshot]

  quicksubmit:
    path: core-workflows/quicksubmit.mdx
    features: [quicksubmit, browser_extension, submission, va_upload]
    upstream_paths:
      - src/components/**/*QuickSubmit*
      - src/pages/**/*quicksubmit*
      - browser-extension/**
      - extension/**
      - backend/internal/**/*submit*
    depends_on_pages: [forms_vsign, documents]
    downstream_pages: [quickstart]
    review: [text, screenshot, walkthrough]

  organization_admin:
    path: administration/organization-settings.mdx
    features: [organizations, settings, team_members, roles, permissions]
    upstream_paths:
      - src/components/**/*Organization*
      - src/components/**/*Member*
      - src/components/**/*Permission*
      - backend/internal/**/*organization*
      - backend/internal/**/*permission*
    downstream_pages: [quickstart, billing_plans]
    review: [text, screenshot]

  billing_plans:
    path: administration/billing.mdx
    features: [billing, plans, usage_limits, overages, feature_visibility, editions]
    upstream_paths:
      - src/components/**/*Billing*
      - src/components/**/*Plan*
      - src/components/**/*Subscription*
      - backend/internal/**/*billing*
      - backend/internal/**/*subscription*
      - backend/internal/**/*entitlement*
      - backend/internal/**/*edition*
    downstream_pages: [welcome, quickstart, organization_admin]
    review: [text, screenshot]

feature_edges:
  primary_point_of_contact: {affects: [clients, client_details, relationships, forms_vsign, quickstart]}
  signing_packets: {affects: [forms_vsign, quickstart]}
  pdf_autofill: {affects: [forms_vsign, clients, quickstart]}
  conditions: {affects: [conditions, clients, reports, quickstart]}
  rating_decisions: {affects: [conditions, reports]}
  evidence: {affects: [documents, reports, ask_vala, quickstart]}
  ai_chat: {affects: [ask_vala, reports, quickstart]}
  tasks: {affects: [tasks, workflows, quickstart]}
  messages: {affects: [messages, client_dashboard]}
  automations: {affects: [workflows, tasks, forms_vsign, quickstart]}
  calls: {affects: [calls, clients, ask_vala, quickstart]}
  quicksubmit: {affects: [quicksubmit, forms_vsign, documents, quickstart]}
  permissions: {affects: [organization_admin, billing_plans, quickstart]}
  billing: {affects: [billing_plans, organization_admin]}
  feature_visibility: {affects: [billing_plans, welcome, quickstart]}
  editions: {affects: [billing_plans, welcome, quickstart]}
